[package]
name = "hspass"
version = "0.1.0"
edition = "2021"
description = "Zero-Knowledge CLI Password Manager, FIDO2/Passkey Emulator, TOTP/HOTP Authenticator & Offline Blockchain Backup Engine"

[dependencies]
# CLI & Terminal UI
clap = { version = "4.5", features = ["derive", "env"] }
inquire = "0.7"
crossterm = "0.28"
ratatui = "0.29"

# Cryptography & Security
argon2 = "0.5"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
sha3 = "0.10"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }

# Serialization & Storage
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# TOTP / HOTP & Passkeys
totp-lite = "2.0"
url = "2.5"

# Utilities & System
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
qrcode = "0.14"
base64 = "0.22"
